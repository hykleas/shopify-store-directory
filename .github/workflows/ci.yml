name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run lint

      # DATABASE_URL yok: sorgular lib/db.ts icindeki safe() ile bos donuyor,
      # build bundan etkilenmiyor.
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com

  crawler:
    name: crawler (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crawler
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install ruff==0.12.2

      - run: ruff check .

      - run: python -m compileall -q .
